{% extends 'base.html' %}
{% load i18n %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-100">
    <div class="col-md-6 col-lg-5">
        <div class="auth-card">
            <div class="auth-header text-center bg-success">
                <h2><i class="bi bi-check-circle"></i> {% trans "تم الإرسال" %}</h2>
            </div>
            
            <div class="card-body p-4 text-center">
                <div class="mb-4">
                    <i class="bi bi-envelope-check" style="font-size: 4rem; color: #28a745;"></i>
                </div>
                
                <h4>{% trans "تم إرسال البريد الإلكتروني" %}</h4>
                <p class="text-muted">
                    {% trans "تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني. يرجى التحقق من صندوق الوارد." %}
                </p>
                
                <div class="mt-4">
                    <a href="{% url 'accounts:login' %}" class="btn btn-primary">
                        <i class="bi bi-box-arrow-in-right"></i> {% trans "تسجيل الدخول" %}
                    </a>
                    <a href="{% url 'index' %}" class="btn btn-outline-secondary">
                        <i class="bi bi-house"></i> {% trans "الرئيسية" %}
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
