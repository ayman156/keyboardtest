{% extends 'base.html' %}
{% load i18n %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-100">
    <div class="col-md-6 col-lg-5">
        <div class="auth-card">
            <div class="auth-header text-center bg-success">
                <h2><i class="bi bi-check-circle"></i> {% trans "تم بنجاح" %}</h2>
            </div>
            
            <div class="card-body p-4 text-center">
                <div class="mb-4">
                    <i class="bi bi-shield-check" style="font-size: 4rem; color: #28a745;"></i>
                </div>
                
                <h4>{% trans "تم تغيير كلمة المرور" %}</h4>
                <p class="text-muted">
                    {% trans "تم تغيير كلمة المرور بنجاح. يمكنك الآن تسجيل الدخول باستخدام كلمة المرور الجديدة." %}
                </p>
                
                <div class="mt-4">
                    <a href="{% url 'accounts:login' %}" class="btn btn-primary btn-lg">
                        <i class="bi bi-box-arrow-in-right"></i> {% trans "تسجيل الدخول" %}
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
