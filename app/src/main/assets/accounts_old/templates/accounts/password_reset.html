{% extends 'base.html' %}
{% load i18n %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-100">
    <div class="col-md-6 col-lg-5">
        <div class="auth-card">
            <div class="auth-header text-center">
                <h2><i class="bi bi-key"></i> {% trans "استعادة كلمة المرور" %}</h2>
                <p class="mb-0">{% trans "أدخل بريدك الإلكتروني لإرسال رابط الاستعادة" %}</p>
            </div>
            
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="id_email" class="form-label">
                            <i class="bi bi-envelope"></i> {% trans "البريد الإلكتروني" %}
                        </label>
                        <input type="email" name="email" id="id_email" 
                               class="form-control" required
                               placeholder="example@domain.com">
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-send"></i> {% trans "إرسال رابط الاستعادة" %}
                        </button>
                        <a href="{% url 'accounts:login' %}" class="btn btn-secondary">
                            <i class="bi bi-arrow-right"></i> {% trans "العودة لتسجيل الدخول" %}
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
